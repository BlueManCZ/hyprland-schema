name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets hyprland-update.yml run CI on bot/hyprland-update: PRs and pushes
  # made with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src/ tests/ scripts/ generate_schema.py
      - run: uv run ruff format --check src/ tests/ scripts/ generate_schema.py
      - run: uv run pyright src/ tests/ scripts/ generate_schema.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
